<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "sameAs": [
      "https://linkedin.com/in/{{ site.linkedin_username }}",
      "https://github.com/{{ site.github_username }}"
    ],
    "jobTitle": "Infrastructure & DevOps Professional"
  }
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  
  <!-- Title, description, canonical, Open Graph and Twitter tags -->
  {% seo %}
</head>
<body>
  <div class="page">
    {{ content }}

    <aside class="ascii-art" aria-hidden="true">
      <pre>{% include ascii-art.txt %}</pre>
    </aside>
  </div>

  <footer>
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
      <p>Last updated: {{ 'now' | date: "%B %Y" }}</p>
    </div>
  </footer>
</body>
</html>
